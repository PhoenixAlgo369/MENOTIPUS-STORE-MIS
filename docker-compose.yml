version: '3.8'

# ===========================================
# MENOTIPUS STORE MIS - Docker Compose
# ===========================================

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: menotipus-db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: menotipus_store
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Flask Backend API
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: menotipus-backend
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/menotipus_store
      FLASK_ENV: development
      FLASK_DEBUG: "True"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-key}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python init_db.py && python run.py"

  # React Frontend
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: menotipus-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  # pgAdmin for database management (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: menotipus-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@menotipus.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:

networks:
  default:
    name: menotipus-network
