[flake8]
max-line-length = 120
extend-ignore = E203, W503
exclude = 
    .git,
    __pycache__,
    venv,
    .venv,
    build,
    dist,
    *.egg-info
per-file-ignores =
    __init__.py: F401
    tests/*: S101,D101,D102,D103

[isort]
profile = black
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88
skip = venv,.venv,build,dist
known_first_party = app
known_third_party = flask,sqlalchemy,marshmallow

[black]
line-length = 88
target-version = ['py312']
include = \.pyi?$
exclude = 
    .git
    .venv
    venv
    __pycache__
    build
    dist

[mypy]
python_version = 3.12
warn_return_any = True
warn_unused_configs = True
ignore_missing_imports = True

[mypy-app.models.*]
ignore_errors = True

[mypy-app.schemas.*]
ignore_errors = True
