# ===========================================
# MENOTIPUS STORE MIS - Production Docker Compose
# ===========================================

version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: menotipus-db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: menotipus_store
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # Flask Backend API
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: menotipus-backend
    volumes:
      - ./logs:/app/logs
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/menotipus_store
      FLASK_ENV: production
      FLASK_DEBUG: "False"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python init_db.py && gunicorn -c gunicorn.conf.py run:app"
    restart: always

  # React Frontend
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: menotipus-frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    restart: always

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: menotipus-nginx
    volumes:
      - ./docker/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    restart: always

volumes:
  postgres_data:

networks:
  default:
    name: menotipus-network
